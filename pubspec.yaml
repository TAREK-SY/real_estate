name: real_estate
description: "Real Scout - a bilingual real estate browsing app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  get: 4.7.3
  easy_localization: ^3.0.8
  flutter_screenutil: ^5.9.3
  http: ^1.6.0
  either_dart: ^1.0.0
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.7
  flutter_svg: ^2.5.0
  intl: ^0.20.3
  iconsax_flutter: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  flutter_cache_manager: ^3.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
    - assets/images/
    - assets/icons/

  # Variable fonts; weights are applied through the wght axis (AppTextStyles).
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
